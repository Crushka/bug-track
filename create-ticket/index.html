<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание багтикета — BugTrack</title>
    <link rel="stylesheet" href="../main-style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-page create-ticket-page">
    <header class="app-header">
        <div id="user-box">
            <div id="account-mount" data-account-icon="qa-icon"></div>
            <div id="user-info">
                <p>Пользователь</p>
                <p>Тестировщик</p>
            </div>
            <div id="notifications-mount"></div>
        </div>
        <div id="logo">
            <span>BugTrack</span>
            <svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M43.125 27.3242V24.4492H35.9375V19.3344C38.5807 16.8232 38.8125 13.5161 38.8125 10.0625V8.625H35.9375V10.0625C35.9375 12.5781 35.7704 14.3885 35.048 15.7981C33.0625 11.5 29.1381 10.0625 23 10.0625C19.4242 10.0625 16.2446 10.6968 13.977 12.2475C12.6383 13.163 11.7129 14.4855 11.0391 15.8161C10.2422 14.4262 10.0625 12.6518 10.0625 10.0625V8.625H7.1875V10.0625C7.1875 13.4262 7.4202 16.6534 10.0625 19.1547V24.4492H2.875V27.3242L10.0625 27.3125C10.0625 29.0195 10.3949 32.0823 10.996 33.5737C8.67891 35.6464 7.1875 37.9419 7.1875 41.6875V43.125H10.0625V41.6875C10.0625 39.2024 10.8801 37.6706 12.4137 36.1783C14.375 40.25 15.9023 41.6875 21.5625 41.6875V15.8125H24.4375V41.6875C30.2773 41.6875 31.625 40.25 33.5863 36.1783C35.1199 37.6706 35.9375 39.2033 35.9375 41.6875V43.125H38.8125V41.6875C38.8125 37.9428 37.3211 35.6473 35.004 33.5737C35.6051 32.0823 35.9375 29.0195 35.9375 27.3125L43.125 27.3242Z" fill="var(--color-primary)"/>
                <path d="M23 2.875C18.6821 2.875 14.375 2.875 14.375 10.4219C16.7217 9.16406 19.7072 8.625 23 8.625C25.1643 8.625 27.1409 8.86309 28.8749 9.34375C29.8407 9.61328 31.0904 10.1263 31.625 10.4219C31.625 2.875 27.3179 2.875 23 2.875Z" fill="var(--color-primary)"/>
            </svg>
        </div>
    </header>

    <main class="ticket-layout">
        <a class="button ticket-back" href="../project-w-r/index.html?reserved=1">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M13.0285 5.25L6.27848 12L13.0285 18.75L11.4375 20.341L3.0965 12L11.4375 3.65901L13.0285 5.25Z" fill="currentColor"/>
                <path d="M4.5 10.875H20.4375V13.125H4.5V10.875Z" fill="currentColor"/>
            </svg>
            <span>Назад к проекту</span>
        </a>

        <form id="create-ticket-form" class="ticket-form" aria-label="Создание багтикета" action="../project-w-r/index.html?reserved=1" method="post">
            <div class="ticket-fields">
                <div class="ticket-field">
                    <label for="ticket-title">Название тикета <span class="ticket-required" aria-hidden="true">*</span></label>
                    <input class="ticket-control" id="ticket-title" name="title" type="text" placeholder="Введите название" maxlength="120" required>
                </div>

                <div class="ticket-field">
                    <label for="ticket-description">Описание бага <span class="ticket-required" aria-hidden="true">*</span></label>
                    <textarea class="ticket-control" id="ticket-description" name="description" maxlength="2000" required></textarea>
                </div>

                <div class="ticket-field ticket-field--steps" role="group" aria-labelledby="ticket-steps-title">
                    <p id="ticket-steps-title">Шаги воспроизведения <span class="ticket-required" aria-hidden="true">*</span></p>
                    <div class="ticket-steps-row">
                        <ol id="ticket-step-list" class="ticket-chip-list"></ol>
                        <button id="open-step-editor" class="ticket-step-add" type="button" aria-label="Добавить шаг" aria-controls="ticket-step-editor" aria-expanded="false">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                    <div id="ticket-step-editor" hidden>
                        <input class="ticket-control" id="ticket-step" type="text" aria-label="Шаг воспроизведения" placeholder="Введите шаг" maxlength="120">
                        <button class="ticket-step-confirm" id="confirm-step" type="button">Добавить</button>
                    </div>
                </div>

                <div class="ticket-field">
                    <label for="ticket-priority">Приоритет <span class="ticket-required" aria-hidden="true">*</span></label>
                    <select id="ticket-priority" class="ticket-control" name="priority" required>
                        <option value="" selected disabled>Номер</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="ticket-field ticket-field--deadline">
                    <label for="ticket-deadline">Дедлайн <span class="ticket-required" aria-hidden="true">*</span></label>
                    <div class="ticket-deadline-control">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M4 4h16v16H4zM4 8h16M8 2v4m8-4v4m-8 6h4v4H8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                        </svg>
                        <span id="ticket-deadline-caption" aria-hidden="true">Выбрать дедлайн</span>
                        <input id="ticket-deadline" type="date" name="deadline" required>
                    </div>
                </div>
            </div>

            <section class="ticket-attachments" aria-labelledby="ticket-attachments-title">
                <h2 id="ticket-attachments-title">Приложенные файлы</h2>
                <ul id="ticket-file-list" class="ticket-chip-list" aria-label="Выбранные файлы"></ul>
                <input id="ticket-files" type="file" accept="image/*,.txt" multiple hidden>
                <button id="attach-ticket-files" class="ticket-more ticket-attach" type="button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span>Приложить файлы</span>
                </button>
                <p id="ticket-file-error" role="status"></p>
            </section>

            <div class="ticket-form-actions">
                <p id="ticket-form-error" role="status"></p>
                <button class="ticket-submit" type="submit">Добавить багтикет</button>
            </div>
        </form>
    </main>

    <template id="ticket-chip-template">
        <li class="ticket-chip">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M9 2 16 7 13.5 15H4.5L2 7Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            <span></span>
            <button type="button">×</button>
        </li>
    </template>

    <script src="../main_script.js"></script>
    <script src="../project-w-r/demo-tickets.js"></script>
    <script src="script.js"></script>
</body>
</html>
