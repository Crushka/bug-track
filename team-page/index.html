<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр команды — BugTrack</title>
    <link rel="stylesheet" href="../main-style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-page team-page">
    <header class="app-header">
        <div id="user-box">
            <div id="account-mount"></div>
            <div id="user-info">
                <p>Пользователь</p>
                <p>Разработчик</p>
            </div>
            <div id="notifications-mount"></div>
        </div>
        <div id="logo">
            <span>BugTrack</span>
            <svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M43.125 27.3242V24.4492H35.9375V19.3344C38.5807 16.8232 38.8125 13.5161 38.8125 10.0625V8.625H35.9375V10.0625C35.9375 12.5781 35.7704 14.3885 35.048 15.7981C33.0625 11.5 29.1381 10.0625 23 10.0625C19.4242 10.0625 16.2446 10.6968 13.977 12.2475C12.6383 13.163 11.7129 14.4855 11.0391 15.8161C10.2422 14.4262 10.0625 12.6518 10.0625 10.0625V8.625H7.1875V10.0625C7.1875 13.4262 7.4202 16.6534 10.0625 19.1547V24.4492H2.875V27.3242L10.0625 27.3125C10.0625 29.0195 10.3949 32.0823 10.996 33.5737C8.67891 35.6464 7.1875 37.9419 7.1875 41.6875V43.125H10.0625V41.6875C10.0625 39.2024 10.8801 37.6706 12.4137 36.1783C14.375 40.25 15.9023 41.6875 21.5625 41.6875V15.8125H24.4375V41.6875C30.2773 41.6875 31.625 40.25 33.5863 36.1783C35.1199 37.6706 35.9375 39.2033 35.9375 41.6875V43.125H38.8125V41.6875C38.8125 37.9428 37.3211 35.6473 35.004 33.5737C35.6051 32.0823 35.9375 29.0195 35.9375 27.3125L43.125 27.3242Z" fill="var(--color-primary)"/>
                <path d="M23 2.875C18.6821 2.875 14.375 2.875 14.375 10.4219C16.7217 9.16406 19.7072 8.625 23 8.625C25.1643 8.625 27.1409 8.86309 28.8749 9.34375C29.8407 9.61328 31.0904 10.1263 31.625 10.4219C31.625 2.875 27.3179 2.875 23 2.875Z" fill="var(--color-primary)"/>
            </svg>
        </div>
    </header>
    <main class="team-layout">
        <h1 class="team-page-title">Просмотр команды</h1>
        <a href="../main-page-develop/index.html" class="button team-back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M13.0285 5.25L6.27848 12L13.0285 18.75L11.4375 20.341L3.0965 12L11.4375 3.65901L13.0285 5.25Z" fill-rule="evenodd" clip-rule="evenodd" fill="var(--color-primary)"/>
                <path d="M4.5 10.875H20.4375V13.125H4.5V10.875Z" fill-rule="evenodd" clip-rule="evenodd" fill="var(--color-primary)"/>
            </svg>
            <span>Назад на главную</span>
        </a>

        <section class="team-captain" aria-labelledby="captain-title">
            <h2 id="captain-title" class="team-section-title">Капитан команды</h2>
            <div id="captain-member"></div>
        </section>

        <section class="team-members" aria-labelledby="members-title">
            <h2 id="members-title" class="team-section-title">Остальные члены команды</h2>
            <div id="team-members-list"></div>
        </section>

        <div class="team-actions">
            <button class="team-leave" type="button" disabled>Выйти из команды</button>
        </div>
    </main>

    <template id="team-member-template">
        <article class="team-member">
            <div class="team-member-profile">
                <svg width="56" height="56" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M0 24C0 10.752 10.752 0 24 0C37.248 0 48 10.752 48 24C48 37.248 37.248 48 24 48C10.752 48 0 37.248 0 24Z" fill="var(--color-muted)"/>
                    <path d="M23.4 7.5C27.384 7.5 30.6 10.716 30.6 14.7C30.6 18.684 27.384 21.9 23.4 21.9C19.416 21.9 16.2 18.684 16.2 14.7C16.2 10.716 19.416 7.5 23.4 7.5ZM23.4 41.58C17.4 41.58 12.096 38.508 9 33.852C9.072 29.076 18.6 26.46 23.4 26.46C28.176 26.46 37.728 29.076 37.8 33.852C34.704 38.508 29.4 41.58 23.4 41.58Z" fill="var(--color-white)"/>
                </svg>
                <h3 class="team-member-name"></h3>
            </div>
            <p class="team-section-title">Зарезервированные тикеты</p>
            <div class="team-ticket-row">
                <ul class="team-ticket-grid" aria-label="Зарезервированные тикеты"></ul>
                <a class="button ticket-more">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span>Показать ещё</span>
                </a>
            </div>
        </article>
    </template>

    <script src="../main_script.js"></script>
    <script src="script.js"></script>
</body>
</html>
